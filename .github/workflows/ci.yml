name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  determinism:
    name: canonical encoding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: conformance vectors
        run: cargo test --workspace --test conformance
      - name: full suite
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: no comments in source
        run: cargo run --quiet -p xtask -- lint-comments
      - name: documentation matches the CLI
        run: cargo run --quiet -p xtask -- lint-docs
      - name: no collapsed line continuations
        run: cargo run --quiet -p xtask -- lint-prose
      - name: every suppression is justified in the ledger
        run: cargo run --quiet -p xtask -- lint-allows
      - name: every command the documentation names exists
        run: cargo run --quiet -p xtask -- lint-invocations

  conformance:
    name: conformance vectors are what the generator writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vectors
      - name: the committed vectors match the generator
        run: git diff --exit-code -- conformance/

  anchors:
    name: anchor survival
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p xtask -- replay --commits 200

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  knowledge:
    name: recorded knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --bin codedoc
      - name: the ledger describes the code it ships with
        run: ./target/release/codedoc doctor
